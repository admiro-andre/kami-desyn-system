<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kami — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kami-theme.css">
<link rel="stylesheet" href="kami-components.css">
<style>
/* Protótipo navegável. Só layout da aplicação; os componentes vêm de kami-components.css */
html,body{height:100%}
body{margin:0;background:var(--evo-color-surface-sunken);font-size:14px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--evo-focus-ring-color);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sprite{position:absolute;width:0;height:0}

/* Barra de contexto (só do protótipo) */
.ctx{position:sticky;top:0;z-index:50;height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--evo-color-surface);border-bottom:1px solid var(--evo-color-border)}
.ctx .seg{height:34px;padding:3px;width:auto}
.ctx .seg a{padding:0 14px;display:flex;align-items:center;font-weight:700;font-size:13px;border-radius:var(--evo-radius-sm);color:var(--evo-color-primary-hover)}
.ctx .seg a.on{background:var(--evo-color-primary);color:var(--evo-color-on-primary)}
.ctx small{color:var(--evo-color-on-surface-muted)}

/* Cliente / mesa */
.stage-app{min-height:calc(100vh - var(--ctxh));background:var(--kami-sun);display:flex;justify-content:center;padding:24px 16px}
.app-phone{width:min(400px,100%);height:min(820px,calc(100vh - 96px));background:var(--evo-color-surface);border-radius:var(--kami-radius-phone);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--kami-shadow-modal)}
.app-phone .screen{overflow:auto;gap:12px}
.app-phone .appbar{height:auto;min-height:64px;padding:12px 16px}
.appbar .back{all:unset;cursor:pointer;display:flex;padding:4px;border-radius:var(--evo-radius-sm)}
.appbar .grow{flex:1;min-width:0}
.pill-row{display:flex;gap:8px;overflow:auto}
.pill-row button{border:1px solid var(--evo-color-border);cursor:pointer}
.pill-row button.on{border-color:var(--evo-color-primary)}
.seg button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border-radius:var(--evo-radius-md);color:var(--evo-color-primary-hover)}
.seg button.on{background:var(--evo-color-primary);color:var(--evo-color-on-primary)}
.stepper button{cursor:pointer}
.addbtn{border:0;cursor:pointer}
.prod .ph{border-radius:var(--evo-radius-md)}
.prod.off{opacity:.55}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--evo-radius-md);background:var(--evo-color-warning-soft);font-size:13px}
.banner b{font-weight:800}
.link{all:unset;cursor:pointer;color:var(--evo-color-primary-hover);font-weight:800;font-size:13px}
.empty{text-align:center;padding:40px 16px;color:var(--evo-color-on-surface-muted)}
.empty b{display:block;color:var(--evo-color-on-surface);font-size:16px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--evo-color-border-strong);border-radius:var(--evo-radius-md);padding:0 12px;height:42px;background:var(--evo-color-surface);font-size:14px}
.field textarea{height:72px;padding:10px 12px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--evo-color-primary);box-shadow:0 0 0 3px var(--evo-color-primary-soft)}

/* Back-office e plataforma */
.desk.app{height:calc(100vh - var(--ctxh));border:0;border-radius:0}
.desk .side .grow{flex:1}
.desk .nav{cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font-family:inherit}
.desk .nav.on{background:var(--evo-color-primary-soft)}
.desk .content{overflow:auto}
.desk .top .right{display:flex;align-items:center;gap:16px;font-size:13px}
.desk .top .toggle{cursor:pointer}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.page-h h3{font-size:18px}
.page-h p{margin:2px 0 0;color:var(--evo-color-on-surface-muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:14px}
.kpi small{color:var(--evo-color-on-surface-muted);font-size:12px}
.kpi b{display:block;font-size:22px;margin-top:2px}
.cols{align-items:start}
.cols>div{min-height:200px}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.mesa{cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.tbl td .btn{vertical-align:middle}
.tbl tr.row-click{cursor:pointer}
.tbl tr.row-click:hover td{background:var(--evo-color-surface-sunken)}
.plan{padding:18px;display:flex;flex-direction:column;gap:10px}
.plan h4{font-size:16px}
.plan .big{font-size:26px;font-weight:800}
.plan ul{margin:0;padding-left:18px;color:var(--evo-color-on-surface-muted)}
.plan.hl{border-top:3px solid var(--evo-color-primary)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--evo-color-on-surface);color:var(--evo-color-surface);padding:10px 16px;border-radius:var(--evo-radius-md);font-weight:700;z-index:100;box-shadow:var(--kami-shadow-modal)}
.scrim{position:fixed;z-index:60}
.mapbox{height:220px}
@media (max-width:820px){
  .desk.app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr;height:auto;min-height:calc(100vh - var(--ctxh))}
  .desk .top{grid-column:1}
  .desk .side{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--evo-color-border)}
  .desk .nav{width:auto;white-space:nowrap}
  .desk .nav.on::before{display:none}
  .kpis{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.cols{grid-template-columns:1fr}
  .ctx small{display:none}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translate(-50%,8px)}}}
/* ---------- Telas extra: entrada, landing, modo frame ---------- */
:root{--ctxh:48px}
.frame{--ctxh:0px}
.frame .ctx{display:none}
.frame .stage-app{padding:0;background:transparent}
.frame .app-phone{width:100%;height:100vh;border-radius:0;box-shadow:none}
.ctx{overflow-x:auto}
.ctx .seg,.ctx small{flex:none}.ctx .seg a{white-space:nowrap}
.refbadge{font-weight:800;font-size:12px;background:var(--evo-color-on-surface);color:var(--evo-color-surface);padding:3px 8px;border-radius:var(--evo-radius-sm);flex:none}
.link{display:inline-flex;align-items:center;gap:6px}
hr{border:0;border-top:1px solid var(--evo-color-border);margin:4px 0;width:100%}
.auth{min-height:calc(100vh - var(--ctxh));display:grid;grid-template-columns:minmax(320px,5fr) 6fr}
.auth-side{background:var(--kami-sun);padding:32px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.auth-side h2{font-size:32px;line-height:1.15;max-width:18ch}
.auth-side p{max-width:38ch}
.auth-main{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--evo-color-surface)}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.auth-card h3{font-size:24px}
.steps{display:flex;gap:6px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--evo-color-border)}
.steps .done,.steps .now{background:var(--evo-color-primary)}
.okmark{width:56px;height:56px;border-radius:var(--evo-radius-lg);background:var(--evo-color-success-soft);color:var(--evo-color-success);display:flex;align-items:center;justify-content:center}
.okmark.sm{width:40px;height:40px;background:var(--evo-color-primary-soft);color:var(--evo-color-primary-hover)}
.empty .okmark{margin:0 auto 12px}
.splash{min-height:calc(100vh - var(--ctxh));background:var(--kami-sun);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.loader{width:120px;height:4px;background:color-mix(in srgb,var(--evo-color-on-surface) 15%,transparent);border-radius:2px;overflow:hidden;margin-top:18px}
.loader span{display:block;height:100%;width:40%;background:var(--evo-color-on-surface)}
@media (prefers-reduced-motion:no-preference){.loader span{animation:ld 1.2s ease-in-out infinite}@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(300%)}}}
.pub{background:var(--evo-color-surface);min-height:calc(100vh - var(--ctxh))}
.pub-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 40px;border-bottom:1px solid var(--evo-color-border)}
.pub-nav nav{display:flex;gap:24px;font-weight:700}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:center;padding:64px 40px;background:var(--kami-sun-soft)}
.hero h1,.rest-hero h1{font-size:44px;line-height:1.1;max-width:16ch}
.hero p,.rest-hero p{font-size:17px;max-width:46ch}
.hero-art{display:flex;flex-direction:column;gap:12px;max-width:380px}
.sec{padding:48px 40px;display:flex;flex-direction:column;gap:20px}
.sec h2{font-size:28px}
.band{background:var(--evo-color-surface-sunken)}
.step b{display:flex;width:32px;height:32px;border-radius:var(--evo-radius-md);background:var(--evo-color-primary);color:var(--evo-color-on-primary);align-items:center;justify-content:center;margin-bottom:8px}
.pub-foot{display:flex;justify-content:space-between;align-items:center;padding:24px 40px;border-top:1px solid var(--evo-color-border)}
.rest-hero{background:var(--kami-sun);padding:32px 40px 56px;display:flex;flex-direction:column;gap:48px}
.bars{display:flex;align-items:flex-end;gap:12px;height:180px}
.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;align-items:center}
.bars span{width:100%;background:var(--evo-color-primary);border-radius:var(--evo-radius-sm) var(--evo-radius-sm) 0 0;display:block}
.bars small{color:var(--evo-color-on-surface-muted)}
.prod h4[data-pv]{cursor:pointer}
@media (max-width:820px){
  .auth{grid-template-columns:1fr}.auth-side{padding:20px}.auth-side .ticket{display:none}.auth-side h2{font-size:24px}
  .hero{grid-template-columns:1fr;padding:32px 20px}.hero h1,.rest-hero h1{font-size:30px}.sec,.pub-nav,.pub-foot,.rest-hero{padding-left:20px;padding-right:20px}.grid3,.grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="cart" viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19 8H6"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>

  <symbol id="box" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></symbol>
  <symbol id="map" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></symbol>
  <symbol id="sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></symbol>

  <symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14.5c2.5 0 4 1.8 4 4.5"/></symbol>
  <symbol id="card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></symbol>
  <symbol id="chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/></symbol>
</svg>
<div class="ctx" id="ctx"></div>
<main id="app"></main>
<div id="layer"></div>

<script src="kami-screens.js"></script>
<script>
if (/[?&]frame/.test(location.search)) document.body.classList.add('frame');
/* ---------- Dados ---------- */
const REST = { nome: 'Restaurante Quilamba', zona: 'Talatona', fecha: '22:00' };
const CATS = ['Pratos', 'Bebidas', 'Sobremesas'];
let PRODUTOS = [
  { id: 1, n: 'Muamba de galinha', d: 'Frango em óleo de palma com quiabo e funge.', p: 4500, c: 'Pratos', on: true, foto: true },
  { id: 2, n: 'Mufete de cacusso', d: 'Peixe grelhado, feijão de óleo de palma e banana.', p: 6800, c: 'Pratos', on: true, foto: true },
  { id: 3, n: 'Calulu de peixe', d: 'Peixe seco com folhas e quiabo.', p: 5200, c: 'Pratos', on: true, foto: false },
  { id: 4, n: 'Feijão de óleo de palma', d: 'Com mandioca cozida.', p: 3000, c: 'Pratos', on: false, foto: true },
  { id: 5, n: 'Cuca 33 cl', d: 'Cerveja angolana.', p: 800, c: 'Bebidas', on: true, foto: true },
  { id: 6, n: 'Sumo de maracujá', d: 'Natural, sem açúcar adicionado.', p: 1200, c: 'Bebidas', on: true, foto: false },
  { id: 7, n: 'Gelado de múcua', d: 'Duas bolas.', p: 1800, c: 'Sobremesas', on: true, foto: true },
];
const ESTADOS = {
  novo: { t: 'Novo', b: 'b-new' }, prep: { t: 'Em preparação', b: 'b-prep' },
  pronto: { t: 'Pronto', b: 'b-ready' }, concluido: { t: 'Concluído', b: 'b-done' }, cancelado: { t: 'Cancelado', b: 'b-cancel' },
};
const SEED = {
  orders: [
    { id: 140, tipo: 'mesa', quem: 'Mesa 2', mesa: 2, itens: [{ n: 'Mufete de cacusso', q: 2, p: 6800 }], estado: 'prep', min: 18, eta: 20 },
    { id: 141, tipo: 'levantamento', quem: 'João Neto', itens: [{ n: 'Muamba de galinha', q: 1, p: 4500 }], estado: 'prep', min: 9, eta: 15 },
    { id: 142, tipo: 'mesa', quem: 'Mesa 4', mesa: 4, itens: [{ n: 'Muamba de galinha', q: 2, p: 4500, o: 'Sem gindungo' }, { n: 'Cuca 33 cl', q: 3, p: 800 }], estado: 'novo', min: 2 },
    { id: 143, tipo: 'entrega', quem: 'Maria Cardoso', itens: [{ n: 'Calulu de peixe', q: 1, p: 5200 }], estado: 'novo', min: 1 },
    { id: 138, tipo: 'mesa', quem: 'Mesa 6', mesa: 6, itens: [{ n: 'Feijão de óleo de palma', q: 1, p: 3000 }], estado: 'pronto', min: 24 },
  ],
  mesasAtivas: [2, 4, 5, 6], next: 144, aberto: true, som: true,
};
const S = (() => { try { return JSON.parse(localStorage.getItem('kami-state')) || structuredClone(SEED); } catch { return structuredClone(SEED); } })();
let cart = []; let modo = 'levantamento'; let cat = 'Pratos'; let lastId = null; let sel = { mesa: 4, prod: 3 }; let modal = null; let obs = '';
const save = () => { try { localStorage.setItem('kami-state', JSON.stringify(S)); } catch {} };

/* ---------- Utilitários ---------- */
const $ = (s, r = document) => r.querySelector(s);
const kz = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' Kz';
const ic = (n, c = '') => `<svg class="i ${c}"><use href="#${n}"/></svg>`;
const tot = its => its.reduce((s, i) => s + i.q * i.p, 0);
const badge = e => `<span class="badge ${ESTADOS[e].b}"><span class="dot"></span>${ESTADOS[e].t}</span>`;
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2200); };
const go = h => { location.hash = h; };
const ctxo = h => (h.split('/')[1] || 'c');

/* ---------- Barra de contexto ---------- */
function renderCtx(area, sc) {
  const tabs = [['a', 'Entrada', '#/a/splash'], ['l', 'Landing', '#/l/kami'], ['c', 'Cliente online', '#/c/menu'], ['m', 'Cliente na mesa', '#/m/scan'], ['b', 'Back-office', '#/b/pedidos'], ['p', 'Plataforma', '#/p/dashboard']];
  $('#ctx').innerHTML = `<div class="logo"><i>K</i>Kami</div><div class="seg">${tabs.map(t => `<a href="${t[2]}" class="${t[0] === area ? 'on' : ''}">${t[1]}</a>`).join('')}</div>${sc ? `<span class="refbadge" title="Referência da tela (kami-screens.js, TELAS.md)">${sc.id}</span><small>${sc.nome}</small>` : ''}<span style="flex:1"></span><a class="btn btn-secondary btn-sm" href="kami-telas.html">Todas as telas</a><button class="btn btn-ghost btn-sm" data-act="reset">Repor dados</button>`;
}

/* ---------- Cliente: menu, carrinho, entrega, acompanhamento ---------- */
const qtd = () => cart.reduce((s, i) => s + i.q, 0);
function phone(inner, bottom = '') { return `<div class="stage-app"><div class="app-phone">${inner}${bottom ? `<div class="bottom">${bottom}</div>` : ''}</div></div>`; }
function appbar(titulo, sub, back) {
  return `<div class="appbar">${back ? `<button class="back" data-go="${back}" aria-label="Voltar">${ic('back')}</button>` : ''}<div class="grow"><b>${titulo}</b>${sub ? `<small>${sub}</small>` : ''}</div></div>`;
}
function viewMenu(mesa) {
  if (!mesa && !S.aberto) return viewFechado();
  const lista = PRODUTOS.filter(p => p.c === cat);
  const topo = mesa
    ? `<div class="appbar"><div class="grow"><b>${REST.nome}</b><small>Mesa 4, atendimento activo</small></div>${ic('table')}</div>`
    : appbar(REST.nome, `Aberto até às ${REST.fecha}, ${REST.zona}`);
  const itens = lista.map(p => `<div class="prod ${p.on ? '' : 'off'}">${p.foto ? `<div class="ph">${ic('image')}</div>` : ''}<div style="flex:1;min-width:0"><h4 data-pv="${p.id}">${p.n}</h4><p>${p.d}</p><div class="meta"><span class="price">${kz(p.p)}</span>${p.on ? `<button class="addbtn" data-add="${p.id}" aria-label="Adicionar ${p.n}">${ic('plus')}</button>` : '<span class="badge b-done">Indisponível</span>'}</div></div></div>`).join('');
  const n = qtd();
  const base = mesa ? 'm' : 'c';
  return phone(`${topo}<div class="screen">
    ${mesa ? '' : `<div class="seg"><button class="${modo === 'levantamento' ? 'on' : ''}" data-modo="levantamento">Levantamento</button><button class="${modo === 'entrega' ? 'on' : ''}" data-modo="entrega">Entrega</button></div>`}
    ${mesa ? `<div class="banner">${ic('info')}<div>Pedidos desta mesa ficam no mesmo atendimento. <button class="link" data-go="#/m/session">Ver pedidos</button></div></div>` : ''}
    <div class="pill-row">${CATS.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('')}</div>
    <div>${itens}</div></div>`,

function viewPedido() {

  return frame('b', NAV_B(), 'historico', `
    <div class="page-h"><div><button class="link" data-go="#/b/historico">${ic('back')}Histórico</button><h3 style="margin-top:6px">Pedido ${pid(o)}</h3></div>${badge(o.estado)}</div>
    <div class="split"><div class="col gap12"><div class="card pad col gap12"><b>Itens</b><div class="tbl"><table><tr><th>Item</th><th class="r">Qtd</th><th class="r">Preço</th></tr>${o.itens.map(i => `<tr><td>${i.n}${i.o ? `<div class="sub">${i.o}</div>` : ''}</td><td class="r">${i.q}</td><td class="r price">${kz(i.q * i.p)}</td></tr>`).join('')}</table></div><div class="sumrow tot"><span>Total</span><span>${kz(sub + (o.tipo === 'entrega' ? 1000 : 0))}</span></div></div>
    ${['novo', 'prep', 'pronto'].includes(o.estado) && S.orders.find(x => x.id === o.id) ? `<div class="row gap8" style="justify-content:flex-end"><button class="btn btn-secondary" data-act="recusar" data-id="${o.id}">Recusar</button><button class="btn btn-primary" data-act="${o.estado === 'novo' ? 'accept' : 'next'}" data-id="${o.id}">${o.estado === 'novo' ? 'Aceitar' : o.estado === 'prep' ? 'Marcar pronto' : 'Concluir'}</button></div>` : ''}</div>
    <div class="col gap12"><div class="card pad col gap8"><b>Cliente</b><div class="sub">${tipoTxt(o)}</div><div class="sub">${o.tipo === 'entrega' ? 'Rua Direita de Talatona' : o.tipo === 'mesa' ? 'Atendimento da mesa' : 'Levanta no restaurante'}</div></div><div class="card pad"><b>Cronologia</b><ul class="timeline" style="margin-top:12px">${ev.map((e, k) => `<li class="${k === ev.length - 1 ? 'now' : 'done'}"><span class="mk">${ic('check')}</span><b>${e[0]}</b><small>${e[1]}</small></li>`).join('')}</ul></div></div></div>`, modal && modal.t === 'accept' ? acceptModal(modal.id) : '');

  return frame('b', NAV_B(), 'equipa', `<div class="page-h"><div><h3>Equipa</h3><p>Defina quem pode encerrar atendimentos e alterar o menu.</p></div><button class="btn btn-primary" data-act="convidar">${ic('plus')}Convidar funcionário</button></div>
    <div class="tbl"><table><tr><th>Nome</th><th>Função</th><th>Permissões</th><th>Estado</th></tr>${eq.map(e => `<tr><td><b>${e[0]}</b></td><td>${e[1]}</td><td>${e[2]}</td><td><span class="badge ${e[3] === 'Activo' ? 'b-ready' : 'b-new'}">${e[3]}</span></td></tr>`).join('')}</table></div>`,
    modal && modal.t === 'convite' ? `<div class="scrim" data-act="fechar"><div class="modal" role="dialog" aria-modal="true" aria-label="Convidar funcionário" onclick="event.stopPropagation()"><h3>Convidar funcionário</h3><div class="field"><label for="cv">Email</label><input id="cv" placeholder="nome@exemplo.ao"></div><div class="field"><label for="cf">Função</label><select id="cf"><option>Atendente</option><option>Cozinha</option><option>Gerente</option></select></div><label class="inline"><span class="check on">${ic('check')}</span>Pode encerrar atendimentos</label><div class="row gap8" style="justify-content:flex-end"><button class="btn btn-secondary" data-act="fechar">Cancelar</button><button class="btn btn-primary" data-act="enviar-convite">Enviar convite</button></div></div></div>` : '');
}
function viewPlanoBO() {
  return frame('b', NAV_B(), 'plano', `<div class="page-h"><div><h3>Plano e facturação</h3><p>O seu plano e o que já usou este mês.</p></div><button class="btn btn-secondary" data-act="toast-ok">Mudar de plano</button></div>
    <div class="split"><div class="card plan hl"><span class="badge b-ready"><span class="dot"></span>Activo</span><h4>Premium</h4><div class="big">Por definir</div><ul><li>Pedidos online e na mesa</li><li>Zonas e taxas de entrega</li></ul></div>
    <div class="card pad col gap12"><b>Uso este mês</b><div><div class="sumrow"><span>Pedidos</span><b>184</b></div><div class="sumrow"><span>Funcionários</span><b>4</b></div><div class="sumrow"><span>Produtos</span><b>${PRODUTOS.length}</b></div></div></div></div>
    <div class="tbl"><table><tr><th>Factura</th><th>Período</th><th>Estado</th><th class="r">Valor</th></tr><tr><td>F-0007</td><td>Outubro 2026</td><td><span class="badge b-new">Por pagar</span></td><td class="r price">—</td></tr><tr><td>F-0006</td><td>Setembro 2026</td><td><span class="badge b-ready">Paga</span></td><td class="r price">—</td></tr></table></div>`);
}

/* ---------- Plataforma: telas extra ---------- */
function viewDashboard() {
  const v = [34, 52, 41, 66, 58, 80, 72];
  return frame('p', NAV_P, 'dashboard', `<div class="page-h"><div><h3>Visão geral</h3><p>Últimos 7 dias</p></div></div>
    <div class="kpis"><div class="card kpi"><small>Restaurantes activos</small><b>2</b></div><div class="card kpi"><small>Pedidos</small><b>403</b></div><div class="card kpi"><small>Novos registos</small><b>3</b></div><div class="card kpi"><small>Em teste</small><b>1</b></div></div>
    <div class="split"><div class="card pad col gap12"><b>Pedidos por dia</b><div class="bars" role="img" aria-label="Pedidos por dia, de 34 a 80">${v.map((n, k) => `<div><span style="height:${n}%"></span><small>${['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'][k]}</small></div>`).join('')}</div></div>
    <div class="card pad col gap8"><b>Registos recentes</b>${REST_LIST.slice(1, 4).map(r => `<div class="sumrow"><span>${r[0]}</span><span class="sub">${r[3]}</span></div>`).join('')}</div></div>`);
}
function viewRestDetalhe() {
  const r = REST_LIST[sRest];
  return frame('p', NAV_P, 'restaurantes', `<div class="page-h"><div><button class="link" data-go="#/p/restaurantes">${ic('back')}Restaurantes</button><h3 style="margin-top:6px">${r[0]}</h3></div><span class="row gap8"><button class="btn btn-secondary" data-act="toast-ok">Mudar plano</button><button class="btn btn-danger" data-act="toast-ok">Suspender</button></span></div>
    <div class="kpis"><div class="card kpi"><small>Plano</small><b>${r[1]}</b></div><div class="card kpi"><small>Estado</small><b>${r[2]}</b></div><div class="card kpi"><small>Cliente desde</small><b style="font-size:16px">${r[3]}</b></div><div class="card kpi"><small>Pedidos</small><b>${r[4]}</b></div></div>
    <div class="split"><div class="card pad col gap8"><b>Contacto</b><div class="sub">gerente@quilamba.ao</div><div class="sub">923 000 111</div><div class="sub">kami.ao/quilamba</div></div><div class="card pad col gap8"><b>Pedidos recentes</b>${S.orders.slice(0, 3).map(o => `<div class="sumrow"><span>${pid(o)}, ${tipoTxt(o)}</span>${badge(o.estado)}</div>`).join('')}</div></div>`);
}

/* ---------- Encaminhamento ---------- */
function render() {
  const h = location.hash || '#/a/splash'; const [, area, pg] = h.split('/');
  const sc = (window.KAMI_SCREENS || []).find(s => s.rota === area + '/' + pg);
  if (!document.body.classList.contains('frame')) renderCtx(area, sc);
  const v = {
    'a/splash': viewSplash, 'a/login': viewLogin, 'a/recuperar': viewRecuperar, 'a/registo': viewRegisto, 'a/registo-restaurante': viewRegistoRest, 'a/registo-plano': viewRegistoPlano, 'a/registo-ok': viewRegistoOk,
    'l/kami': viewLandingKami, 'l/restaurante': viewLandingRest,
    'c/menu': () => viewMenu(false), 'c/produto': viewProduto, 'c/cart': () => viewCart(false), 'c/checkout': viewCheckout, 'c/confirmacao': viewConfirmacao, 'c/track': viewTrack, 'c/fechado': viewFechado, 'c/foradazona': viewForaZona,
    'm/scan': viewScan, 'm/menu': () => viewMenu(true), 'm/produto': viewProduto, 'm/cart': () => viewCart(true), 'm/session': viewSession, 'm/encerrado': viewEncerrado,
    'b/pedidos': viewPedidos, 'b/novo-pedido': () => { const n = S.orders.find(o => o.estado === 'novo'); if (n) modal = { t: 'accept', id: n.id }; return viewPedidos(); }, 'b/pedido': viewPedido, 'b/historico': viewHistorico, 'b/mesas': viewMesas, 'b/produtos': viewProdutos, 'b/categorias': viewCategorias, 'b/zonas': viewZonas, 'b/equipa': viewEquipa, 'b/plano': viewPlanoBO, 'b/definicoes': viewDefinicoes,
    'p/dashboard': viewDashboard, 'p/restaurantes': viewRestaurantes, 'p/restaurante': viewRestDetalhe, 'p/planos': viewPlanos,
  }[area + '/' + pg] || viewSplash;
  $('#app').innerHTML = v(); $('#layer').innerHTML = '';
  const root = $('#app').firstElementChild; if (root && sc) root.dataset.screen = sc.id;
  document.title = (sc ? sc.id + ' ' + sc.nome + ' · ' : '') + 'Kami';
}
addEventListener('hashchange', () => { modal = null; render(); });

/* ---------- Acções ---------- */
const novoPedido = (tipo, quem, mesa) => {
  const id = S.next++; S.orders.unshift({ id, tipo, quem, mesa, itens: cart.map(i => ({ n: i.n, q: i.q, p: i.p, o: obs || undefined })), estado: 'novo', min: 0 });
  if (mesa && !S.mesasAtivas.includes(mesa)) S.mesasAtivas.push(mesa);
  cart = []; obs = ''; lastId = id; save(); return id;
};
const ordemEstado = ['novo', 'prep', 'pronto', 'concluido'];
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-add],[data-inc],[data-dec],[data-rm],[data-modo],[data-cat],[data-act],[data-mesa],[data-prod],[data-pv],[data-ov],[data-rest],[data-plano],[data-hist]'); if (!t) return;
  const d = t.dataset;
  if (d.go) return go(d.go);
  if (d.add) { const p = PRODUTOS.find(x => x.id == d.add); const l = cart.find(i => i.n === p.n); l ? l.q++ : cart.push({ n: p.n, p: p.p, q: 1 }); return render(); }
  if (d.inc) { cart[d.inc].q++; return render(); }
  if (d.dec) { cart[d.dec].q > 1 ? cart[d.dec].q-- : cart.splice(d.dec, 1); return render(); }
  if (d.rm) { cart.splice(d.rm, 1); return render(); }
  if (d.modo) { modo = d.modo; return render(); }
  if (d.cat) { cat = d.cat; return render(); }
  if (d.mesa) { sel.mesa = +d.mesa; return render(); }
  if (d.prod) { sel.prod = +d.prod; return render(); }
  if (d.pv) { pd = { id: +d.pv, q: 1 }; return go('#/' + baseR() + '/produto'); }
  if (d.ov) { sOrder = +d.ov; return go('#/b/pedido'); }
  if (d.rest !== undefined) { sRest = +d.rest; return go('#/p/restaurante'); }
  if (d.plano) { reg.plano = d.plano; return render(); }
  if (d.hist) { hfil = d.hist; return render(); }
  const id = +d.id; const o = S.orders.find(x => x.id === id);
  switch (d.act) {
    case 'reset': localStorage.removeItem('kami-state'); location.reload(); break;
    case 'enviar-online': { const n = $('#nome')?.value || 'Cliente'; novoPedido(modo, n); go('#/c/confirmacao'); break; }
    case 'enviar-mesa': { obs = $('#obs')?.value || ''; novoPedido('mesa', 'Mesa 4', 4); toast('Pedido enviado para a cozinha'); go('#/m/session'); break; }
    case 'avancar-demo': { const x = S.orders.find(q => q.id === lastId); if (x) { if (x.estado === 'novo') x.eta = 20; const k = ordemEstado.indexOf(x.estado); if (k < 3) x.estado = ordemEstado[k + 1]; save(); render(); } break; }
    case 'accept': modal = { t: 'accept', id }; render(); break;
    case 'fechar': modal = null; render(); break;
    case 'aceitar': o.estado = 'prep'; o.eta = +($('#eta')?.value || 20); modal = null; save(); toast('Pedido aceite'); render(); break;
    case 'next': o.estado = ordemEstado[ordemEstado.indexOf(o.estado) + 1]; save(); toast(o.estado === 'concluido' ? 'Pedido concluído' : 'Estado actualizado'); render(); break;
    case 'recusar': o.estado = 'cancelado'; save(); toast('Pedido recusado'); render(); break;
    case 'simular-novo': S.orders.unshift({ id: S.next++, tipo: 'mesa', mesa: 5, quem: 'Mesa 5', itens: [{ n: 'Mufete de cacusso', q: 1, p: 6800 }, { n: 'Sumo de maracujá', q: 2, p: 1200 }], estado: 'novo', min: 0 }); if (!S.mesasAtivas.includes(5)) S.mesasAtivas.push(5); save(); render(); break;
    case 'som': S.som = !S.som; save(); render(); break;
    case 'aberto': S.aberto = !S.aberto; save(); toast(S.aberto ? 'Restaurante aberto' : 'Restaurante fechado'); render(); break;
    case 'encerrar': S.mesasAtivas = S.mesasAtivas.filter(n => n !== sel.mesa); S.orders.forEach(x => { if (x.mesa === sel.mesa) x.mesa = undefined, x.tipo = 'mesa'; }); save(); toast('Atendimento encerrado'); render(); break;
    case 'abrir-mesa': S.mesasAtivas.push(sel.mesa); save(); render(); break;
    case 'toggle-prod': { const p = PRODUTOS.find(x => x.id === sel.prod); p.on = !p.on; render(); break; }
    case 'guardar-prod': { const p = PRODUTOS.find(x => x.id === sel.prod); p.n = $('#pn').value; p.c = $('#pc').value; p.p = +$('#pp').value || p.p; p.d = $('#pd').value; toast('Produto guardado'); render(); break; }
    case 'novo-prod': { const id2 = Math.max(...PRODUTOS.map(x => x.id)) + 1; PRODUTOS.push({ id: id2, n: 'Novo produto', d: '', p: 0, c: 'Pratos', on: false, foto: false }); sel.prod = id2; render(); break; }
    case 'cancelar-prod': render(); break;
    case 'guardar-def': REST.nome = $('#rn').value; REST.fecha = $('#rf').value; toast('Definições guardadas'); render(); break;
    case 'recuperar': toast('Enviámos a ligação para o seu email'); go('#/a/login'); break;
    case 'modo-levantar': modo = 'levantamento'; go('#/c/checkout'); break;
    case 'pd-inc': pd.q++; render(); break;
    case 'pd-dec': if (pd.q > 1) pd.q--; render(); break;
    case 'pd-add': { const p = PRODUTOS.find(x => x.id === pd.id); const l = cart.find(i => i.n === p.n); l ? l.q += pd.q : cart.push({ n: p.n, p: p.p, q: pd.q }); toast('Adicionado ao carrinho'); go('#/' + baseR() + '/menu'); break; }
    case 'convidar': modal = { t: 'convite' }; render(); break;
    case 'enviar-convite': modal = null; toast('Convite enviado'); render(); break;
    case 'toast-ok': toast('Fora do âmbito deste protótipo'); break;
    case 'add-mesa': case 'add-zona': case 'novo-rest': case 'qr': toast('Fora do âmbito deste protótipo'); break;
  }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('toggle')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape' && modal) { modal = null; render(); } });
render();
</script>
</body>
</html>
